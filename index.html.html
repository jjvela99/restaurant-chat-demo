<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Chat Restaurante</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .chat-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      background: #111827;
      color: white;
      z-index: 1000;
    }

    .chat-widget {
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 360px;
      max-width: calc(100vw - 32px);
      height: 520px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 999;
    }

    .chat-widget.open {
      display: flex;
    }

    .chat-header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    .chat-header h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }

    .chat-header p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background: #f9fafb;
    }

    .message-row {
      display: flex;
      margin-bottom: 10px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.bot {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message-row.user .message-bubble {
      background: #111827;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .message-bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      background: white;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #111827;
    }

    .send-btn {
      border: none;
      background: #111827;
      color: white;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .chat-widget {
        right: 12px;
        bottom: 84px;
        width: calc(100vw - 24px);
        height: 70vh;
      }

      .chat-toggle {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <button class="chat-toggle" id="chatToggle">💬</button>

  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <h3>La Trattoria Madrid</h3>
      <p>Respuestas automáticas sobre horarios, ubicación y más</p>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message-row bot">
        <div class="message-bubble">
          ¡Hola! Soy el asistente del restaurante. ¿En qué puedo ayudarte?
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Escribe tu pregunta..."
      />
      <button id="sendBtn" class="send-btn">Enviar</button>
    </div>
  </div>

  <script>
    const webhookUrl = "https://ai-automation-agency.app.n8n.cloud/webhook/restaurant-bot";

    const chatToggle = document.getElementById("chatToggle");
    const chatWidget = document.getElementById("chatWidget");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    let isOpen = false;

    chatToggle.addEventListener("click", () => {
      isOpen = !isOpen;
      chatWidget.classList.toggle("open", isOpen);
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    function addMessage(text, sender) {
      const row = document.createElement("div");
      row.className = `message-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addTypingIndicator() {
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.id = "typingIndicator";
      typing.textContent = "Escribiendo...";
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typingIndicator");
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      chatInput.value = "";
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();
        removeTypingIndicator();

        const botReply = data.response || data.message || "No pude procesar la respuesta.";
        addMessage(botReply, "bot");
      } catch (error) {
        removeTypingIndicator();
        addMessage("Hubo un problema al conectar con el asistente.", "bot");
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }
  </script>
</body>
</html>
